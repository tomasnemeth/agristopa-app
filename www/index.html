<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AgriStopa</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(120% 90% at 50% 0%, #1b5e3a 0%, #0d2a1c 60%, #08180f 100%);
    color: #eaf5ee;
    text-align: center;
  }
  .card { max-width: 380px; width: 100%; }
  .mark {
    width: 84px; height: 84px; margin: 0 auto 22px;
    border-radius: 24px;
    background: #ffffff0f;
    border: 1px solid #ffffff1f;
    display: grid; place-items: center;
  }
  .mark svg { width: 46px; height: 46px; }
  h1 { font-size: 26px; letter-spacing: -0.01em; margin: 0 0 10px; font-weight: 650; }
  p { margin: 0 0 8px; font-size: 15px; line-height: 1.55; color: #b9d4c4; }
  .hint { margin-top: 26px; font-size: 13px; color: #7ca890; }
  .dots { display: inline-flex; gap: 5px; margin-top: 20px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; opacity: .35; animation: b 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s }
  .dots i:nth-child(3) { animation-delay: .4s }
  @keyframes b { 0%,100% { opacity:.25 } 50% { opacity:1 } }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 20c3-8 6-12 9-12s6 4 9 12" />
        <circle cx="12" cy="8" r="2.4" />
      </svg>
    </div>
    <h1>AgriStopa</h1>
    <p>Aplikácia sa načítava.</p>
    <p>Ak to trvá dlho, skontroluj pripojenie na internet — pri prvom spustení ho aplikácia potrebuje.</p>
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="hint">Evidencia práce strojov</div>
  </div>
</body>
</html>
