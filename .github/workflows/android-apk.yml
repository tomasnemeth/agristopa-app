name: Zostav Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  priprav-vydanie:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Zaloz vydanie ak neexistuje
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view najnovsia >/dev/null 2>&1 || \
            gh release create najnovsia --title "AgriStopa - najnovsia verzia" \
              --notes "AgriStopa.apk - pre vodicov (kabina). AgriStopa-Vedenie.apk - pre vedenie, mechanizatora a ekonoma."

  build:
    needs: priprav-vydanie
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: kabina
            apk: AgriStopa.apk
          - variant: vedenie
            apk: AgriStopa-Vedenie.apk
    steps:
      - name: Stiahni zdrojove subory
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Nastav variant ${{ matrix.variant }}
        run: |
          cp config/${{ matrix.variant }}.json capacitor.config.json
          cat capacitor.config.json

      - name: Instaluj zavislosti
        run: npm install

      - name: Vytvor Android projekt
        run: npx cap add android

      - name: Nekresli pod stavovu listu
        run: |
          sed -i 's/targetSdkVersion = 35/targetSdkVersion = 34/' android/variables.gradle
          grep targetSdkVersion android/variables.gradle

      - name: Synchronizuj
        run: npx cap sync android

      - name: Zostav APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Zverejni APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ${{ matrix.apk }}
          gh release upload najnovsia ${{ matrix.apk }} --clobber
