name: Zostav Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Stiahni zdrojove subory
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instaluj zavislosti
        run: npm install

      - name: Vytvor Android projekt
        run: npx cap add android

      - name: Nekresli pod stavovu listu
        run: |
          sed -i 's/targetSdkVersion = 35/targetSdkVersion = 34/' android/variables.gradle
          grep targetSdkVersion android/variables.gradle

      - name: Synchronizuj
        run: npx cap sync android

      - name: Zostav APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Uloz APK
        uses: actions/upload-artifact@v4
        with:
          name: AgriStopa-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Zverejni APK na trvalej adrese
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AgriStopa.apk
          gh release view najnovsia >/dev/null 2>&1 || \
            gh release create najnovsia --title "AgriStopa - najnovsia verzia" \
              --notes "Stiahnite si subor AgriStopa.apk nizsie a nainstalujte ho v telefone."
          gh release upload najnovsia AgriStopa.apk --clobber
